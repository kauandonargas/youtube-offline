name: Build e publicar atualizacao

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'installer/**'
      - 'scripts/**'
      - 'build/**'
      - '*.sln'
      - 'VERSION'
      - 'RELEASE_NOTES.md'
      - 'source/**'
      - 'youtube-offline-source-*.zip'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-offline-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Restaurar e consolidar codigo-fonte
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP 'youtube-offline-source'
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $zipFile = Get-ChildItem -Path . -Filter 'youtube-offline-source-*.zip' -File -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($zipFile) {
            Write-Host "Usando pacote ZIP: $($zipFile.Name)"
            Expand-Archive -Path $zipFile.FullName -DestinationPath $stage -Force
          }
          elseif (Test-Path 'source') {
            $parts = Get-ChildItem 'source/part-*.b64' -File -ErrorAction SilentlyContinue | Sort-Object Name
            if (-not $parts) { throw 'Nao foi encontrado um ZIP nem as partes temporarias do codigo-fonte.' }
            Write-Host "Reconstruindo pacote a partir de $($parts.Count) partes temporarias..."
            $b64 = (($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join '') -replace '\s',''
            $bytes = [Convert]::FromBase64String($b64)
            $tempZip = Join-Path $env:RUNNER_TEMP 'youtube-offline-source.zip'
            [IO.File]::WriteAllBytes($tempZip, $bytes)
            Expand-Archive -Path $tempZip -DestinationPath $stage -Force
          }
          elseif (Test-Path 'src/LocalTube.App/LocalTube.App.csproj') {
            Write-Host 'Codigo-fonte ja esta consolidado no repositorio.'
            exit 0
          }
          else {
            throw 'Codigo-fonte do YouTube Offline nao encontrado.'
          }

          $items = @(
            'src',
            'installer',
            'scripts',
            'build',
            'LocalTube.sln',
            'CRIAR-INSTALADOR.cmd',
            'README.md',
            'RELEASE_NOTES.md',
            'VERSION',
            'TESTING.md',
            '.gitignore'
          )

          foreach ($item in $items) {
            $from = Join-Path $stage $item
            if (-not (Test-Path $from)) { continue }
            $to = Join-Path (Get-Location) $item
            if ((Get-Item $from).PSIsContainer) {
              if (Test-Path $to) { Remove-Item $to -Recurse -Force }
              Copy-Item $from $to -Recurse -Force
            }
            else {
              Copy-Item $from $to -Force
            }
          }

          if (Test-Path 'source') { Remove-Item 'source' -Recurse -Force }
          Get-ChildItem -Path . -Filter 'youtube-offline-source-*.zip' -File -ErrorAction SilentlyContinue | Remove-Item -Force

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src installer scripts build LocalTube.sln CRIAR-INSTALADOR.cmd README.md RELEASE_NOTES.md VERSION TESTING.md .gitignore source
          git add -A -- 'youtube-offline-source-*.zip'
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Consolida codigo-fonte do YouTube Offline'
            git push
          }

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ler versao
        id: version
        shell: pwsh
        run: |
          $text = Get-Content 'src/LocalTube.App/LocalTube.App.csproj' -Raw
          $m = [regex]::Match($text, '<Version>([^<]+)</Version>')
          if (-not $m.Success) { throw 'Versao nao encontrada no csproj.' }
          $version = $m.Groups[1].Value.Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$') { throw "Versao invalida: $version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Versao: $version"

      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Gerar instalador
        shell: powershell
        run: .\scripts\build-installer.ps1 -Version '${{ steps.version.outputs.version }}' -NoOpen

      - name: Calcular SHA-256
        id: hash
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $exe = "dist/installer/YouTube-Offline-Setup-$version-x64.exe"
          if (-not (Test-Path $exe)) { throw "Instalador nao encontrado: $exe" }
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$exe.sha256" -Value "$hash  YouTube-Offline-Setup-$version-x64.exe" -Encoding ascii
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host "SHA-256: $hash"

      - name: Preparar notas
        shell: pwsh
        run: |
          if (Test-Path 'RELEASE_NOTES.md') {
            $notes = (Get-Content 'RELEASE_NOTES.md' -Raw).Trim()
          } else {
            $notes = 'Atualizacao do YouTube Offline.'
          }
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = 'Atualizacao do YouTube Offline.' }
          Set-Content -Path "$env:RUNNER_TEMP/release-notes.md" -Value $notes -Encoding utf8

      - name: Publicar GitHub Release
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $exe = "dist/installer/YouTube-Offline-Setup-$version-x64.exe"
          $sha = "$exe.sha256"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $sha --repo '${{ github.repository }}' --clobber
          } else {
            gh release create $tag $exe $sha --repo '${{ github.repository }}' --title "YouTube Offline $version" --notes-file "$env:RUNNER_TEMP/release-notes.md"
          }

      - name: Atualizar feed publico
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $sha256 = '${{ steps.hash.outputs.sha256 }}'
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/v$version/YouTube-Offline-Setup-$version-x64.exe"
          $notesRaw = if (Test-Path 'RELEASE_NOTES.md') { (Get-Content 'RELEASE_NOTES.md' -Raw).Trim() } else { 'Atualizacao do YouTube Offline.' }
          $noteLines = @($notesRaw -split "`r?`n" | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') } | ForEach-Object { $_ -replace '^[-*]\s*', '' })
          if (-not $noteLines.Count) { $noteLines = @('Atualizacao do YouTube Offline.') }
          $manifest = [ordered]@{
            schemaVersion = 1
            product = 'YouTube Offline'
            version = $version
            publishedAt = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            installerUrl = $installerUrl
            sha256 = $sha256
            mandatory = $false
            notes = $noteLines
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content update.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Atualiza feed para YouTube Offline $version"
            git push
          }
