name: Aplicar tamanho dos downloads

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-download-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar melhoria e criar versao 0.5.8
        shell: pwsh
        run: |
          $b64 = ''
          $script = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($b64))
          Invoke-Expression $script
