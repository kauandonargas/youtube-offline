name: Verificacao Windows

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Guardas de regressao
        shell: pwsh
        run: .\tests\check-source-guards.ps1

      - name: Compilar aplicativo Windows
        shell: pwsh
        run: |
          # O build oficial materializa o icone versionado antes do dotnet publish.
          .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Build oficial falhou.' }

      - name: Startup, API e medidas de repouso
        shell: pwsh
        run: |
          $text = Get-Content .\src\LocalTube.App\LocalTube.App.csproj -Raw
          $m = [regex]::Match($text, '<Version>([^<]+)</Version>')
          if (-not $m.Success) { throw 'Versao nao encontrada.' }
          .\tests\verify-startup.ps1 -AppPath ".\dist\YouTubeOffline\YouTubeOffline.exe" -ExpectedVersion $m.Groups[1].Value -MetricsPath "$env:RUNNER_TEMP\startup-metrics.json"

      - name: Evidencias de tempo e recursos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-metrics
          path: ${{ runner.temp }}\startup-metrics.json
          if-no-files-found: ignore

  installer-lock:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar e conferir instalador publicado 0.5.18
        shell: pwsh
        run: |
          $url = 'https://github.com/kauandonargas/youtube-offline/releases/download/v0.5.18/YouTube-Offline-Setup-0.5.18-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'YouTube-Offline-Setup-0.5.18-x64.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -MaximumRedirection 10
          $actual = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '187eda553c11d13d32449056555d115b0eafe2cad773ac00d07b1266394559d3') {
            throw 'Checksum do instalador de referencia divergente.'
          }

      - name: Reinstalar com yt-dlp bloqueado
        shell: pwsh
        run: |
          .\tests\verify-installer.ps1 -InstallerPath "$env:RUNNER_TEMP\YouTube-Offline-Setup-0.5.18-x64.exe" -WorkDir "$env:RUNNER_TEMP\installer-lock-test"

      - name: Logs do Inno Setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-lock-logs
          path: ${{ runner.temp }}\installer-lock-test\logs\*.log
          if-no-files-found: ignore
