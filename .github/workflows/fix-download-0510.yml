name: Aplicar correcoes do download 0.5.10

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/fix-download-0510.yml'
      - '.github/patches/fix-0510.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar patch
        run: python .github/patches/fix-0510.py

      - name: Publicar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-download-0510.yml
          git rm .github/patches/fix-0510.py
          git add src VERSION RELEASE_NOTES.md
          git commit -m 'YouTube Offline 0.5.10: corrige download e feedback da fila'
          git push
